<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="shortcut icon" href="./favicon.svg">
<meta name="description" content="Cloud Linux Terminal">
<title>Cloud Linux Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="login" class="login">
  <form class="login-panel" id="loginForm">
    <div class="login-brand"><span>CL</span><i>_</i></div>
    <h1>Cloud Linux</h1>
    <p class="login-subtitle">Защищённый вход в систему</p>
    <label for="userPickerTrigger">Пользователь</label>
    <input id="user" type="hidden" value="artem" autocomplete="username">
    <div class="user-picker" id="userPicker">
      <button class="user-picker-trigger" id="userPickerTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="user-avatar" id="userAvatar">A</span><span id="selectedUser">artem</span><span class="chevron">⌄</span>
      </button>
      <div class="user-picker-menu" id="userPickerMenu" role="listbox" hidden>
        <button class="user-option selected" type="button" role="option" aria-selected="true" data-user="artem">artem</button>
        <button class="user-option" type="button" role="option" aria-selected="false" data-user="root">root</button>
      </div>
    </div>
    <label for="password">Пароль</label>
    <input id="password" class="login-input" type="password" autocomplete="current-password" placeholder="Введите пароль">
    <label for="otp">OTP-код</label>
    <input id="otp" class="login-input" type="password" autocomplete="one-time-code" placeholder="Введите код подтверждения">
    <button id="loginBtn" class="login-submit" type="submit">Войти <span>↗</span></button>
    <p id="loginMsg" class="login-message" role="status" aria-live="polite"></p>
  </form>
</section>
<main id="app" hidden>
  <header class="topbar">
    <div class="workspace-title">Рабочая область</div>
    <nav class="toolbar" aria-label="Действия">
      <button id="logoutBtn" class="icon-btn" title="Выход" aria-label="Выход"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg></button>
      <button id="refreshBtn" class="icon-btn" title="Обновить" aria-label="Обновить"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"/></svg></button>
      <button id="filesBtn" class="icon-btn" title="Файлы" aria-label="Файлы"><svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9h18"/></svg></button>
      <button id="historyBtn" class="icon-btn" title="История" aria-label="История"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
      <button id="runBtn" class="run-btn" title="Запустить диагностику"><span>↓</span> Диагностика</button>
    </nav>
  </header>
  <section class="terminal" id="terminal" aria-label="Терминал">
    <div class="terminal-tab"><span class="tab-mark">›_</span><span>Cloud Linux Terminal</span></div>
    <div class="terminal-body" id="terminalBody">
      <div class="welcome-line">Cloud Linux Terminal <span>— защищённая диагностическая среда</span></div>
      <div class="welcome-hint">Введите <b>help</b>, чтобы увидеть доступные команды.</div>
      <div id="output" aria-live="polite"></div>
    </div>
    <form id="commandForm" class="command-form">
      <span class="prompt">cloudlinux:~$</span>
      <input id="command" spellcheck="false" autocomplete="off" aria-label="Команда" placeholder="Введите команду…">
      <button type="submit" aria-label="Выполнить">↵</button>
    </form>
  </section>
  <div id="explorer" class="overlay" hidden>
    <section class="explorer" role="dialog" aria-modal="true" aria-labelledby="explorerTitle">
      <header class="explorer-head"><b id="explorerTitle">История</b><button id="closeFiles" aria-label="Закрыть">×</button></header>
      <div id="tree" class="tree"></div>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
